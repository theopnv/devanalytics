name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - name: Check that generated files are up to date
        run: |
          npm run sync
          npm run build:action
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::npm run sync or npm run build:action changed files. Run both commands and commit the result."
            git status --short
            git diff
            exit 1
          fi
