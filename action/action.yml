name: Devanalytics
description: Collects one metric of the repository and uploads it to your Devanalytics Worker.

inputs:
  metric:
    description: The metric to collect. The name of a folder in metrics/.
    required: true
  worker-url:
    description: The address of the Worker. Use the DEVANALYTICS_URL variable.
    required: true
  token:
    description: The ingest token of the Worker. Use the DEVANALYTICS_INGEST_TOKEN secret.
    required: true
  working-directory:
    description: The folder to read, relative to the workspace.
    required: false
    default: .
  # BEGIN METRIC INPUTS (generated by `npm run build:action`)
  include:
    description: "complexity: Globs of the files to measure, one on each line. Default: src/**/*.{ts,tsx,js,jsx}."
    required: false
  exclude:
    description: "complexity: Globs of the files to skip, one on each line. The node_modules folders are always skipped."
    required: false
  test-pattern:
    description: "complexity: Globs of the test files, one on each line. The summaries keep test functions apart. Default: **/*.test.*."
    required: false
  cognitive-limit:
    description: "complexity: A function above this cognitive complexity counts as above the limit. Default: 15."
    required: false
  cyclomatic-limit:
    description: "complexity: A function above this cyclomatic complexity counts as above the limit. Default: 10."
    required: false
  file:
    description: "example: JSON file with the items, and optionally the sha and the date. Default: example.json."
    required: false
  # END METRIC INPUTS

runs:
  using: node24
  main: dist/index.js
