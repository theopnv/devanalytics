name: Devanalytics
description: Collects one metric of the repository and uploads it to your Devanalytics Worker.

inputs:
  metric:
    description: The metric to collect. The name of a folder in metrics/.
    required: true
  worker-url:
    description: The address of the Worker. Use the DEVANALYTICS_URL variable.
    required: true
  token:
    description: The ingest token of the Worker. Use the DEVANALYTICS_INGEST_TOKEN secret.
    required: true
  working-directory:
    description: The folder to read, relative to the workspace.
    required: false
    default: .
  # BEGIN METRIC INPUTS (generated by `npm run build:action`)
  run-id:
    description: "ci: The workflow run to record. The default is the run of the workflow_run event, or the current run. tests: The workflow run to record. The default is the run of the workflow_run event, or the current run."
    required: false
  run-attempt:
    description: "ci: The attempt of the run. The default comes from the same place as run-id. tests: The attempt of the run. The default comes from the same place as run-id."
    required: false
  github-token:
    description: "ci: A token with actions: read. The collector reads the run, its jobs and their logs with it. tests: A token with actions: read. The collector reads the start of the run with it when no other source has it. When the working-directory has no subfolder, it also downloads the artifacts of the run into it."
    required: false
  labels:
    description: "ci: Optional. Free key=value pairs, one on each line, stored with the run as JSON."
    required: false
  include:
    description: "complexity: Globs of the files to measure, one on each line. Default: src/**/*.{ts,tsx,js,jsx}."
    required: false
  exclude:
    description: "complexity: Globs of the files to skip, one on each line. The node_modules folders are always skipped."
    required: false
  test-pattern:
    description: "complexity: Globs of the test files, one on each line. The summaries keep test functions apart. Default: **/*.test.*."
    required: false
  cognitive-limit:
    description: "complexity: A function above this cognitive complexity counts as above the limit. Default: 15."
    required: false
  cyclomatic-limit:
    description: "complexity: A function above this cyclomatic complexity counts as above the limit. Default: 10."
    required: false
  reports:
    description: "coverage: One coverage report on each line, as suite=path: an Istanbul coverage-final.json or an lcov.info. With two or more reports, the total suite is their union. The paths are relative to working-directory. tests: One test report on each line, as suite=path. The working-directory has one subfolder for each runner, and the path is relative to that subfolder. The file is a JUnit XML, a Vitest JSON or a Playwright JSON."
    required: false
  test-results:
    description: "coverage: Optional. One test report on each line, as suite=path: a Vitest JSON, a Playwright JSON or a JUnit XML. It fills the test counts of each suite."
    required: false
  file:
    description: "example: JSON file with the items, and optionally the sha and the date. Default: example.json."
    required: false
  run-started-at:
    description: "tests: The start of the run in ISO 8601. The default is the start in the workflow_run event, or the value that GitHub gives for the run."
    required: false
  # END METRIC INPUTS

runs:
  using: node24
  main: dist/index.js
